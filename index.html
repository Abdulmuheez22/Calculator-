 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="calculator2.css">
</head>
<body>
    <div class="calculator">
    <input type="text" name="" id="display" readonly>
    <div>Preview: <span id="preview"> _ </span> </div>
     <div class="colour">
    <div class="row">
        <button class="btn" id="clear">C</button>
        <button class="btn" id="del">DEL</button>
        <button class="btn" id="m">%</button>
        <button class="btn" id="me">/</button>
    </div>
    <div class="rat">
        <button class="btn" id="you">7</button>
        <button class="btn" id="why">8</button>
        <button class="btn" id="next">9</button>
        <button class="btn" id="no">*</button>
    </div>
    <div class="ram">
        <button class="btn" id="r">4</button>
        <button class="btn" id="f">5</button>
        <button class="btn" id="a">6</button>
        <button class="btn" id="o">-</button>
    </div>
    <div class="yam">
        <button class="btn" id="mar">1</button>
        <button class="btn" id="mir">2</button>
        <button class="btn" id="mat">3</button>
        <button class="btn" id="ba">+</button>
    </div>
    <div class="kids">
        <button class="btn" id="ru">0</button>
        <button class="btn" id="red">.</button>
        <button class="btn" id="age">=</button>
    </div>
    </div>
   </div>

    <script src="calculator2.js"></script>
</body>
</html>
